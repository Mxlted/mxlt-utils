name: Feature request
description: Suggest an improvement to mxlt-utils.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the task or problem, and how you handle it today.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: How would you like it to work?
      description: A short example is helpful. Include alternatives you've considered, if any.
    validations:
      required: true
